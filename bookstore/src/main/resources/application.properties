# ============================================================
# Application
# ============================================================
spring.application.name=ecommerce-bookstore

# ============================================================
# Server
# ============================================================
server.port=8081
server.servlet.context-path=/

# ============================================================
# DataSource – PostgreSQL
# ============================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/ecommerce_bookstore
spring.datasource.username=postgres
spring.datasource.password=Qwerty@123
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================================================
# JPA / Hibernate
# ============================================================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ============================================================
# SpringDoc / Swagger UI
# ============================================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true

# ============================================================
# JWT
# ============================================================
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.jwt.expiration-ms=3600000

# ============================================================
# Business Rules
# ============================================================
app.order.cancellation-window-hours=48
app.cart.free-shipping-threshold=50.00
app.cart.shipping-charge=3.99
app.cart.tax-rate=0.09

# ============================================================
# Logging
# ============================================================
logging.level.com.bookstore=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.springframework.security=INFO
